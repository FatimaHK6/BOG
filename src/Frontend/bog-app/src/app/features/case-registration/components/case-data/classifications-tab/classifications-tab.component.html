<app-section-container
  title="قائمة التصنيف"
  sectionId="classifications"
  [showActions]="canEdit">

  <!-- Add button in header -->
  <button slot="header-actions"
          mat-raised-button
          class="gold-button"
          (click)="openSelectionDialog()"
          *ngIf="canEdit">
    <mat-icon>add</mat-icon>
    إضافة تصنيف
  </button>

  <!-- Content area -->
  <div class="classifications-tab-container">

    <!-- Selected Classifications Table -->
    <div class="table-container" *ngIf="selectedClassifications.length > 0">
    <table mat-table [dataSource]="selectedClassifications" class="classifications-table">

      <!-- Level 1 Column -->
      <ng-container matColumnDef="level1">
        <th mat-header-cell *matHeaderCellDef>المستوى الأول</th>
        <td mat-cell *matCellDef="let classification">
          {{ classification.level1 || '-' }}
        </td>
      </ng-container>

      <!-- Level 2 Column -->
      <ng-container matColumnDef="level2">
        <th mat-header-cell *matHeaderCellDef>المستوى الثاني</th>
        <td mat-cell *matCellDef="let classification">
          {{ classification.level2 || '-' }}
        </td>
      </ng-container>

      <!-- Level 3 Column -->
      <ng-container matColumnDef="level3">
        <th mat-header-cell *matHeaderCellDef>المستوى الثالث</th>
        <td mat-cell *matCellDef="let classification">
          {{ classification.level3 || '-' }}
        </td>
      </ng-container>

      <!-- Level 4 Column -->
      <ng-container matColumnDef="level4">
        <th mat-header-cell *matHeaderCellDef>المستوى الرابع</th>
        <td mat-cell *matCellDef="let classification">
          {{ classification.level4 || '-' }}
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>الإجراءات</th>
        <td mat-cell *matCellDef="let classification">
          <button mat-icon-button [matMenuTriggerFor]="menu" *ngIf="canEdit">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="removeClassification(classification)">
              <mat-icon>delete</mat-icon>
              <span>حذف</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="selectedClassifications.length === 0 && !loading">
    <mat-icon>description</mat-icon>
    <p>لا يوجد اي سجلات</p>
  </div>

  <!-- Loading State -->
  <div class="loading-state" *ngIf="loading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>جاري تحميل التصنيفات...</p>
  </div>

  </div>
</app-section-container>
