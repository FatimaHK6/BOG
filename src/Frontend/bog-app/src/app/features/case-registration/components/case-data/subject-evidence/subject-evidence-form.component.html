<div dir="rtl" class="subject-evidence-container">
  <!-- Container 1: Case Subject -->
  <app-section-container
    title="موضوع الدعوى"
    sectionId="case-subject"
    [showActions]="canEdit">

    <button slot="header-actions"
            mat-raised-button
            class="deficiency-button"
            (click)="openSubjectDeficiencyDialog()"
            *ngIf="canEdit">
      استكمال النواقص
    </button>

    <form [formGroup]="subjectEvidenceForm">
      <div class="editor-wrapper" [class.disabled]="!canEdit">
        <ngx-editor
          [editor]="subjectEditor"
          formControlName="subject"
          placeholder="أدخل موضوع الدعوى هنا...">
        </ngx-editor>
      </div>

      <div class="validation-error" *ngIf="hasError('subject', 'required')">
        موضوع الدعوى مطلوب
      </div>
      <div class="validation-error" *ngIf="hasError('subject', 'maxlength')">
        يجب ألا يتجاوز {{ getMaxCharacters('subject') }} حرف
      </div>

      <div class="character-counter">
        <span class="count">
          {{ getCharacterCount('subject') }} / {{ getMaxCharacters('subject') }}
        </span>
        <mat-progress-bar
          mode="determinate"
          [value]="getCharacterPercentage('subject')"
          [class.warning]="getCharacterPercentage('subject') > 80"
          [class.error]="getCharacterPercentage('subject') >= 100">
        </mat-progress-bar>
      </div>
    </form>
  </app-section-container>

  <!-- Container 2: Case Evidence/Grounds -->
  <app-section-container
    title="أسانيد الدعوى"
    sectionId="case-grounds"
    [showActions]="canEdit">

    <button slot="header-actions"
            mat-raised-button
            class="deficiency-button"
            (click)="openGroundsDeficiencyDialog()"
            *ngIf="canEdit">
      استكمال النواقص
    </button>

    <form [formGroup]="subjectEvidenceForm">
      <div class="editor-wrapper" [class.disabled]="!canEdit">
        <ngx-editor
          [editor]="evidenceEditor"
          formControlName="evidence"
          placeholder="أدخل أسانيد الدعوى هنا...">
        </ngx-editor>
      </div>

      <div class="validation-error" *ngIf="hasError('evidence', 'required')">
        أسانيد الدعوى مطلوبة
      </div>
      <div class="validation-error" *ngIf="hasError('evidence', 'maxlength')">
        يجب ألا يتجاوز {{ getMaxCharacters('evidence') }} حرف
      </div>

      <div class="character-counter">
        <span class="count">
          {{ getCharacterCount('evidence') }} / {{ getMaxCharacters('evidence') }}
        </span>
        <mat-progress-bar
          mode="determinate"
          [value]="getCharacterPercentage('evidence')"
          [class.warning]="getCharacterPercentage('evidence') > 80"
          [class.error]="getCharacterPercentage('evidence') >= 100">
        </mat-progress-bar>
      </div>
    </form>
  </app-section-container>
</div>
