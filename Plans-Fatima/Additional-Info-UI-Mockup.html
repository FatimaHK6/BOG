<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلومات إضافية - UI Mockup</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            direction: rtl;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .page-header {
            background: #1B5E20;
            color: white;
            padding: 15px 20px;
            margin: -30px -30px 30px -30px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
        }

        .btn-next {
            background: white;
            color: #1B5E20;
            padding: 8px 24px;
            border-radius: 4px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .section-container {
            border: 1px solid #c8e6c9;
            border-radius: 4px;
            padding: 24px;
            margin-bottom: 24px;
            background: #ffffff;
        }

        .section-title {
            color: #2e7d32;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e8f5e9;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field.full-width {
            grid-column: 1 / -1;
        }

        .form-field label {
            font-size: 14px;
            color: #424242;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-field input,
        .form-field select {
            padding: 12px;
            border: 1px solid #bdbdbd;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            background: white;
            transition: border-color 0.2s;
        }

        .form-field input:focus,
        .form-field select:focus {
            outline: none;
            border-color: #1B5E20;
            box-shadow: 0 0 0 2px rgba(27, 94, 32, 0.1);
        }

        .form-field select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 12px center;
            background-size: 16px;
            padding-left: 36px;
        }

        .save-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 4px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #c8e6c9;
            border-top-color: #2e7d32;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-note {
            background: #fff3e0;
            border-right: 4px solid #ff9800;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #e65100;
        }

        .field-note {
            font-size: 12px;
            color: #757575;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <div class="page-title">معلومات إضافية</div>
            <button class="btn-next">التالي</button>
        </div>

        <form>
            <!-- القسم الأول: دعاوى إلغاء القرارات الإدارية -->
            <div class="section-container">
                <h3 class="section-title">دعاوى إلغاء القرارات الإدارية</h3>

                <div class="grid-2col">
                    <div class="form-field">
                        <label>رقم القرار</label>
                        <input type="text" placeholder="أدخل رقم القرار">
                    </div>

                    <div class="form-field">
                        <label>تاريخ القرار</label>
                        <input type="date">
                    </div>

                    <div class="form-field">
                        <label>طريقة العلم بالقرار</label>
                        <select>
                            <option value="">اختر</option>
                            <option value="1">الإبلاغ بالقرار</option>
                            <option value="2">العلم به</option>
                            <option value="3">الجريدة الرسمية</option>
                        </select>
                        <div class="field-note">اختر الطريقة التي تم بها العلم بالقرار</div>
                    </div>

                    <div class="form-field">
                        <label>تاريخ العلم بالقرار</label>
                        <input type="date">
                    </div>

                    <div class="form-field full-width">
                        <label>جهة إصدار القرار</label>
                        <select>
                            <option value="">اختر</option>
                            <option value="1">وزارة العدل</option>
                            <option value="2">وزارة الداخلية</option>
                            <option value="3">الهيئة العامة للولاية على أموال القاصرين</option>
                            <option value="4">ديوان المظالم</option>
                        </select>
                        <div class="field-note">اختر الجهة الحكومية التي أصدرت القرار</div>
                    </div>
                </div>
            </div>

            <!-- القسم الثاني: دعاوى الحقوق المتعلقة بالخدمة والتقاعد ودعاوى الإلغاء -->
            <div class="section-container">
                <h3 class="section-title">دعاوى الحقوق المتعلقة بالخدمة والتقاعد ودعاوى الإلغاء</h3>

                <div class="grid-2col">
                    <div class="form-field">
                        <label>يوجد تظلم</label>
                        <select>
                            <option value="">اختر</option>
                            <option value="true">نعم</option>
                            <option value="false">لا</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label>تاريخ التظلم</label>
                        <input type="date">
                    </div>

                    <div class="form-field">
                        <label>الجهة المتظلم لها</label>
                        <select>
                            <option value="">اختر</option>
                            <option value="1">وزارة العدل</option>
                            <option value="2">وزارة الداخلية</option>
                            <option value="3">الهيئة العامة للولاية على أموال القاصرين</option>
                            <option value="4">ديوان المظالم</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label>رقم التظلم</label>
                        <input type="text" placeholder="أدخل رقم التظلم">
                    </div>

                    <div class="form-field">
                        <label>تاريخ البت في التظلم</label>
                        <input type="date">
                    </div>

                    <div class="form-field">
                        <label>نتيجة النظام</label>
                        <input type="text" placeholder="أدخل نتيجة النظام">
                    </div>
                </div>
            </div>

            <!-- القسم الثالث: نزاع علامة تجارية -->
            <div class="section-container">
                <h3 class="section-title">نزاع علامة تجارية</h3>

                <div class="grid-2col">
                    <div class="form-field">
                        <label>رقم الطلب</label>
                        <input type="text" placeholder="أدخل رقم الطلب">
                    </div>

                    <div class="form-field">
                        <label>تاريخه</label>
                        <input type="date">
                    </div>
                </div>
            </div>

            <!-- Auto-save Indicator (shown when saving) -->
            <div class="save-indicator" style="display: none;">
                <div class="spinner"></div>
                <span>جاري الحفظ التلقائي...</span>
            </div>
        </form>
    </div>

    <script>
        // Simulate auto-save on form changes
        const form = document.querySelector('form');
        const saveIndicator = document.querySelector('.save-indicator');
        let saveTimeout;

        form.addEventListener('change', function() {
            // Clear previous timeout
            clearTimeout(saveTimeout);

            // Show saving indicator
            saveIndicator.style.display = 'flex';

            // Simulate 2-second save delay
            saveTimeout = setTimeout(function() {
                saveIndicator.style.display = 'none';
                console.log('Form auto-saved!');
            }, 2000);
        });
    </script>
</body>
</html>
